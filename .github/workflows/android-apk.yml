name: Android APK

# Builds every Capacitor app under apps/ and attaches the APKs to the run
# (open the run in the Actions tab, then download from "Artifacts").
on:
  push:
    paths: ['apps/**', 'mockups/**', 'scripts/build-apk.sh', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['apps/**', 'mockups/**', 'scripts/build-apk.sh', '.github/workflows/android-apk.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'debug (test build) or release (needs signing secrets)'
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - name: Build APKs
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'debug' }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          shopt -s nullglob
          for cfg in apps/*/capacitor.config.json; do
            scripts/build-apk.sh "$(dirname "$cfg")" "$MODE"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist/*.apk
          if-no-files-found: error
